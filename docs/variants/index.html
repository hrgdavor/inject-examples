<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Variant Review</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0; padding: 2rem;
  background: #f4f4f2; color: #1a1a18;
  font: 16px/1.5 ui-sans-serif, system-ui, sans-serif;
}
h1 { font-size: 1.6rem; margin: 0 0 1.5rem; }
.grid {
  display: grid; grid-template-columns: repeat(2, 1fr); gap: 1.5rem;
  max-width: 70rem; margin: 0 auto;
}
.frame {
  border: 2px solid #ccc; border-radius: 12px; overflow: hidden;
  background: #fff;
}
.frame .label {
  padding: .6rem 1rem; font-size: .8rem; font-weight: 700; text-transform: uppercase;
  letter-spacing: .08em; background: #f0f0ee; border-bottom: 2px solid #ccc;
  display: flex; justify-content: space-between; align-items: center;
}
.frame .label a {
  font-size: .75rem; color: #c98d00; text-decoration: none; font-weight: 600;
}
.frame .label a:hover { text-decoration: underline; }
.frame iframe {
  width: 100%; height: 380px; border: none; display: block;
}
@media (max-width: 700px) {
  .grid { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<h1>Landing Page Variants</h1>
<div class="grid">
  <div class="frame">
    <div class="label">1 — Split Hero <a href="variant-1-split.html" target="_blank">open full ↗</a></div>
    <iframe src="variant-1-split.html"></iframe>
  </div>
  <div class="frame">
    <div class="label">2 — Terminal <a href="variant-2-terminal.html" target="_blank">open full ↗</a></div>
    <iframe src="variant-2-terminal.html"></iframe>
  </div>
  <div class="frame">
    <div class="label">3 — Glass <a href="variant-3-glass.html" target="_blank">open full ↗</a></div>
    <iframe src="variant-3-glass.html"></iframe>
  </div>
  <div class="frame">
    <div class="label">4 — Brutalist <a href="variant-4-brutalist.html" target="_blank">open full ↗</a></div>
    <iframe src="variant-4-brutalist.html"></iframe>
  </div>
</div>
</body>
</html>
